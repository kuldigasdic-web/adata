<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Adatu Fabrikas Laika Portāls</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Sākuma ekrāns audio un video atļaušanai */
      #startOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999999;
      }

      #startBtn {
        padding: 16px 32px;
        background: linear-gradient(135deg, #d97706, #b45309);
        color: white;
        border: none;
        border-radius: 35px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(217, 119, 6, 0.6);
      }

      /* Informācijas josla augšā */
      #statusBox {
        display: none;
        position: absolute;
        top: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 360px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #fff;
        padding: 12px 18px;
        border-radius: 20px;
        border: 1px solid rgba(245, 158, 11, 0.4);
        text-align: center;
        z-index: 10000;
      }
      #statusBox h3 {
        margin: 0 0 2px 0;
        font-size: 15px;
        color: #fbbf24;
        letter-spacing: 1px;
      }
      #statusBox p {
        margin: 0;
        font-size: 13px;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <!-- Aktivizācijas logs -->
    <div id="startOverlay">
      <button id="startBtn">Ieslēgt Laika Portālu</button>
    </div>

    <div id="statusBox">
      <h3>LAIKA PORTĀLS</h3>
      <p id="status-text">Pavērsiet kameru pret attēlu</p>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.01; missTolerance: 6;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- Noņemts loop, lai video varētu dabiski beigties un aizvērt portālu -->
        <video 
          id="smedeVideo" 
          src="./smede.mp4" 
          preload="auto" 
          crossorigin="anonymous"
          playsinline 
          webkit-playsinline>
        </video>

        <!-- Akmens tekstūra eja iekšpusei -->
        <img id="stoneTexture" src="https://images.unsplash.com/photo-1590069261209-f8e9b8642343?auto=format&fit=crop&w=1000&q=80">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="portalTarget" mindar-image-target="targetIndex: 0">
        
        <!-- VISU PORTĀLU IETVEROŠA GRUPA ar sākotnējo mērogu 0 0 0 (aizvērts) -->
        <a-entity id="portalContainer" scale="0 0 0" visible="false">
          
          <!-- 1. Ārējais dzelzs rāmis -->
          <a-ring 
            position="0 0 0.02" 
            radius-inner="0.65" 
            radius-outer="0.82" 
            material="color: #1c1917; roughness: 0.9;">
          </a-ring>

          <!-- Kvēlojošā laika spirāle -->
          <a-ring 
            position="0 0 0.03" 
            radius-inner="0.63" 
            radius-outer="0.65" 
            material="color: #f59e0b; emissive: #d97706; emissiveIntensity: 2.0;"
            animation="property: rotation; to: 0 0 360; dur: 12000; easing: linear; loop: true">
          </a-ring>

          <!-- 2. Akmens eja dziļumā (0.8 m) -->
          <a-cylinder 
            position="0 0 -0.4" 
            rotation="90 0 0" 
            radius="0.64" 
            height="0.8" 
            open-ended="true" 
            side="back" 
            material="src: #stoneTexture; roughness: 0.7; color: #57534e;">
          </a-cylinder>

          <!-- 3. Portāla dibens ar smēdes video -->
          <a-circle 
            position="0 0 -0.8" 
            radius="0.64" 
            side="front" 
            material="src: #smedeVideo; shader: flat;">
          </a-circle>

          <!-- Uguns atblāzmas pulsācija portāla iekšpusē -->
          <a-entity 
            light="type: point; intensity: 2.5; distance: 2.5; color: #f97316;" 
            position="0 0 -0.4"
            animation="property: light.intensity; from: 1.8; to: 3.2; dir: alternate; dur: 400; loop: true">
          </a-entity>

          <a-text 
            value="ADATU KALĒJI • 18. GADSIMTS" 
            position="0 0.95 0.05" 
            align="center" 
            scale="0.6 0.6 0.6" 
            color="#fbbf24">
          </a-text>

        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const startOverlay = document.querySelector('#startOverlay');
      const startBtn = document.querySelector('#startBtn');
      const statusBox = document.querySelector('#statusBox');
      const statusText = document.querySelector('#status-text');
      const video = document.querySelector('#smedeVideo');
      const target = document.querySelector('#portalTarget');
      const portal = document.querySelector('#portalContainer');

      let openTimer = null;
      let isPortalOpen = false;

      // Lietotājs atļauj video/audio
      startBtn.addEventListener('click', () => {
        video.play().then(() => {
          video.pause();
          video.currentTime = 0;
        }).catch(() => {});

        startOverlay.style.display = 'none';
        statusBox.style.display = 'block';
      });

      // Mērķis atrasts kameras skatā
      target.addEventListener('targetFound', () => {
        statusText.innerHTML = "Atzīme atrasta. Sinhronizējas ar 18. gs...";

        // 2 sekunžu aizture pirms atvēršanās
        openTimer = setTimeout(() => {
          openPortal();
        }, 2000);
      });

      // Mērķis pazaudēts no skata
      target.addEventListener('targetLost', () => {
        if (openTimer) clearTimeout(openTimer);
        closePortalQuickly();
        statusText.innerText = "Pavērsiet kameru pret attēlu";
      });

      // Portāla lēna atvēršanās
      function openPortal() {
        isPortalOpen = true;
        portal.setAttribute('visible', 'true');
        statusText.innerHTML = "Portāls atvērts! <b>Ieskaties 18. gadsimtā</b>";

        // Animējam mērogu no 0 līdz 1 divu sekunžu laikā
        portal.removeAttribute('animation');
        portal.setAttribute('animation', {
          property: 'scale',
          from: '0 0 0',
          to: '1 1 1',
          dur: 2000,
          easing: 'easeOutBack'
        });

        // Palaižam video un skaņu
        video.currentTime = 0;
        video.play();
      }

      // Video beigu notikums — lēna aizvēršanās
      video.addEventListener('ended', () => {
        statusText.innerHTML = "Laika saikne pārtrūka. Portāls aizveras...";

        // Lēni saraujam portālu 1.5 sekunžu laikā
        portal.removeAttribute('animation');
        portal.setAttribute('animation', {
          property: 'scale',
          from: '1 1 1',
          to: '0 0 0',
          dur: 1500,
          easing: 'easeInQuad'
        });

        setTimeout(() => {
          portal.setAttribute('visible', 'false');
          isPortalOpen = false;
          statusText.innerText = "Portāls noslēdzies. Pavērsiet kameru no jauna.";
        }, 1500);
      });

      // Ātra aizvēršana, ja telefons tiek novērsts projām
      function closePortalQuickly() {
        video.pause();
        portal.setAttribute('visible', 'false');
        portal.setAttribute('scale', '0 0 0');
        isPortalOpen = false;
      }
    </script>
  </body>
</html>
