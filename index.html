<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Adatu Fabrikas Laika Portāls</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Liela, skaidra poga pa virsu visam kameras skatam */
      #startOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999999;
      }

      #startBtn {
        padding: 16px 32px;
        background: linear-gradient(135deg, #d97706, #b45309);
        color: white;
        border: none;
        border-radius: 35px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(217, 119, 6, 0.6);
      }

      /* Neliels paziņojums augšā */
      #statusBox {
        display: none;
        position: absolute;
        top: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 360px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #fff;
        padding: 12px 18px;
        border-radius: 20px;
        border: 1px solid rgba(245, 158, 11, 0.4);
        text-align: center;
        z-index: 10000;
      }
      #statusBox h3 {
        margin: 0 0 2px 0;
        font-size: 15px;
        color: #fbbf24;
        letter-spacing: 1px;
      }
      #statusBox p {
        margin: 0;
        font-size: 13px;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <!-- Sākuma ekrāns ar pogu audio/video atļaušanai -->
    <div id="startOverlay">
      <button id="startBtn">Ieslēgt Laika Portālu (ar skaņu)</button>
    </div>

    <div id="statusBox">
      <h3>LAIKA PORTĀLS</h3>
      <p id="status-text">Pavērsiet kameru pret attēlu</p>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.01; missTolerance: 6;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- playsinline un webkit-playsinline ir obligāti iPhone Safari pārlūkam -->
        <video 
          id="smedeVideo" 
          src="./smede.mp4" 
          preload="auto" 
          loop 
          crossorigin="anonymous"
          playsinline 
          webkit-playsinline>
        </video>

        <!-- Akmens mūra tekstūra kambara iekšpusei -->
        <img id="stoneTexture" src="https://images.unsplash.com/photo-1590069261209-f8e9b8642343?auto=format&fit=crop&w=1000&q=80">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="portalTarget" mindar-image-target="targetIndex: 0">
        
        <!-- 1. Ārējā arka uz virsmas (vecs tumšs dzelzs rāmis) -->
        <a-ring 
          position="0 0 0.02" 
          radius-inner="0.65" 
          radius-outer="0.82" 
          material="color: #1c1917; roughness: 0.9;">
        </a-ring>

        <!-- Kvēlojošā laika spirāle -->
        <a-ring 
          position="0 0 0.03" 
          radius-inner="0.63" 
          radius-outer="0.65" 
          material="color: #f59e0b; emissive: #d97706; emissiveIntensity: 2.0;"
          animation="property: rotation; to: 0 0 360; dur: 12000; easing: linear; loop: true">
        </a-ring>

        <!-- 2. "Mucas" eja dziļumā (0.8 metrus dziļa, ar akmens tekstūru) -->
        <a-cylinder 
          position="0 0 -0.4" 
          rotation="90 0 0" 
          radius="0.64" 
          height="0.8" 
          open-ended="true" 
          side="back" 
          material="src: #stoneTexture; roughness: 0.7; color: #57534e;">
        </a-cylinder>

        <!-- 3. MUCAS DIBENS AR SMĒDES VIDEO (-0.8 m dziļumā) -->
        <a-circle 
          position="0 0 -0.8" 
          radius="0.64" 
          side="front" 
          material="src: #smedeVideo; shader: flat;">
        </a-circle>

        <!-- Uguns gaismas pulsācija portāla iekšienē -->
        <a-entity 
          light="type: point; intensity: 2.5; distance: 2.5; color: #f97316;" 
          position="0 0 -0.4"
          animation="property: light.intensity; from: 1.8; to: 3.2; dir: alternate; dur: 400; loop: true">
        </a-entity>

        <a-text 
          value="ADATU KALĒJI • 18. GADSIMTS" 
          position="0 0.95 0.05" 
          align="center" 
          scale="0.6 0.6 0.6" 
          color="#fbbf24">
        </a-text>

      </a-entity>
    </a-scene>

    <script>
      const startOverlay = document.querySelector('#startOverlay');
      const startBtn = document.querySelector('#startBtn');
      const statusBox = document.querySelector('#statusBox');
      const video = document.querySelector('#smedeVideo');
      const target = document.querySelector('#portalTarget');
      const statusText = document.querySelector('#status-text');

      // Lietotājs nospiež pogu — atbloķē video un audio
      startBtn.addEventListener('click', () => {
        video.play().then(() => {
          // Ja kamera vēl neredz target, nopauzējam līdz atrašanai
          video.pause();
        }).catch(err => {
          console.log("Video atskaņošanas gaidīšana:", err);
        });

        startOverlay.style.display = 'none';
        statusBox.style.display = 'block';
      });

      // Tiklīdz ierauga medmāsas attēlu
      target.addEventListener('targetFound', () => {
        video.play();
        statusText.innerHTML = "Portāls atvērts! <b>Ieskaties dziļāk atverē</b>";
      });

      // Kad attēls pazūd no redzesloka
      target.addEventListener('targetLost', () => {
        video.pause();
        statusText.innerText = "Pavērsiet kameru pret attēlu";
      });
    </script>
  </body>
</html>
