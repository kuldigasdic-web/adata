<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Adatu Fabrikas Laika Portāls</title>
    <!-- A-Frame un MindAR bibliotēkas -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* UI paziņojums */
      #ui-box {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 360px;
        background: rgba(18, 18, 18, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #fff;
        padding: 14px 20px;
        border-radius: 20px;
        border: 1px solid rgba(220, 150, 60, 0.4);
        text-align: center;
        z-index: 1000;
        box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      }
      #ui-box h3 {
        margin: 0 0 4px 0;
        font-size: 16px;
        color: #fca311;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      #ui-box p {
        margin: 0;
        font-size: 13px;
        color: #ccc;
      }
    </style>
  </head>
  <body>
    <div id="ui-box">
      <h3>Laika Portāls</h3>
      <p id="status-text">Pavērsiet kameru pret mērķi pie sienas</p>
    </div>

    <!-- MindAR aina ar kameras skatu fonā -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.01; missTolerance: 6;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- Vēsturiskās smēdes/ceha fona tekstūra iekšpusē -->
        <img id="forge360" src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1600&q=80">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="portalTarget" mindar-image-target="targetIndex: 0">
        
        <!-- 1. PORTĀLA IETVARS / ARKA UZ SIENAS (akmens/metāla rāmis) -->
        <a-ring 
          position="0 0 0.02" 
          radius-inner="0.68" 
          radius-outer="0.82" 
          material="color: #2b1d0c; roughness: 0.8; metalness: 0.3;"
          animation="property: scale; from: 0 0 0; to: 1 1 1; dur: 1500; easing: easeOutElastic;">
        </a-ring>

        <!-- Mirdzošā portāla laika spirāles mala -->
        <a-ring 
          position="0 0 0.03" 
          radius-inner="0.66" 
          radius-outer="0.69" 
          material="color: #ff9e00; emissive: #e85d04; emissiveIntensity: 1.5;"
          animation="property: rotation; to: 0 0 360; dur: 10000; easing: linear; loop: true">
        </a-ring>

        <!-- 2. IESKATS "AIZ SIENAS" (Dziļuma telpa / kambaris) -->
        <!-- Cilindrs, kas iestiepjas -1.2 metrus IEKŠĀ SIENĀ -->
        <a-cylinder 
          position="0 0 -0.6" 
          rotation="90 0 0" 
          radius="0.67" 
          height="1.2" 
          open-ended="true" 
          side="back" 
          material="src: #forge360; roughness: 0.6;">
        </a-cylinder>

        <!-- Kambara tālākā aizmugurējā siena ar kalēja ceha skatu -->
        <a-circle 
          position="0 0 -1.2" 
          radius="0.67" 
          side="front" 
          material="src: #forge360; roughness: 0.5;">
        </a-circle>

        <!-- 3. KVĒLOJOŠĀ UGUNS / LAKTA TELPAS DZIĻUMĀ -->
        <!-- Gaismas avots no smēdes ugunskura aiz sienas -->
        <a-entity light="type: point; intensity: 3; distance: 3; color: #ff5400;" position="0 -0.2 -0.8"></a-entity>
        
        <!-- Kvēlojošas ogles / dzirksteļu imitācija kambara apakšā -->
        <a-sphere 
          position="0 -0.4 -0.9" 
          radius="0.12" 
          material="color: #ffba08; emissive: #d00000; emissiveIntensity: 2.2;"
          animation="property: scale; from: 0.9 0.9 0.9; to: 1.1 1.1 1.1; dir: alternate; dur: 800; loop: true">
        </a-sphere>

        <!-- Uzraksts portāla augšpusē -->
        <a-text 
          value="ADATU KALĒJI • 18. GS." 
          position="0 0.95 0.05" 
          align="center" 
          scale="0.6 0.6 0.6" 
          color="#ffb703" 
          font="aileronsemibold">
        </a-text>

      </a-entity>
    </a-scene>

    <script>
      const target = document.querySelector('#portalTarget');
      const statusText = document.querySelector('#status-text');

      target.addEventListener('targetFound', () => {
        statusText.innerHTML = "Portāls atvērts! <b>Ieskaties dziļāk sienā</b>";
      });

      target.addEventListener('targetLost', () => {
        statusText.innerText = "Pavērsiet kameru pret mērķi pie sienas";
      });
    </script>
  </body>
</html>
