<!-- A-Frame un MindAR bibliotēkas -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Audio un video atbloķēšanas poga mobilajām ierīcēm */
  #soundBtn {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 28px;
    background: linear-gradient(135deg, #d97706, #b45309);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 30px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    z-index: 9999;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(180, 83, 9, 0.5);
  }

  /* Informācijas panelis ekrāna augšdaļā */
  #ui-box {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 86%;
    max-width: 360px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #ffffff;
    padding: 12px 18px;
    border-radius: 16px;
    border: 1px solid rgba(245, 158, 11, 0.4);
    text-align: center;
    z-index: 1000;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
  }
  #ui-box h3 {
    margin: 0 0 3px 0;
    font-size: 15px;
    color: #fbbf24;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #ui-box p {
    margin: 0;
    font-size: 12px;
    color: #cbd5e1;
  }
</style>


<!-- Paziņojumu josla -->
<div id="ui-box">
  <h3>Laika Portāls</h3>
  <p id="status-text">Pavērsiet kameru pret atzīmi pie sienas</p>
</div>

<!-- MindAR aina ar kameras attēlu fonā un OneEuro stabilitātes filtriem -->
<a-scene 
  mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.01; missTolerance: 6;" 
  color-space="sRGB" 
  renderer="colorManagement: true, physicallyCorrectLights" 
  vr-mode-ui="enabled: false" 
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <!-- Vēsturiskais smēdes video fails repozitorijā -->
    <video 
      id="forgeVideo" 
      src="./smede.mp4" 
      preload="auto" 
      loop 
      playsinline 
      webkit-playsinline>
    </video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Portāls, kas piesaistīts pirmajam mērķim no targets.mind -->
  <a-entity id="portalTarget" mindar-image-target="targetIndex: 0">
    
    <!-- 1. Ārējais metāla un akmens rāmis uz sienas virsmas -->
    <a-ring 
      position="0 0 0.02" 
      radius-inner="0.75" 
      radius-outer="0.92" 
      material="color: #1f2937; roughness: 0.9; metalness: 0.3;">
    </a-ring>

    <!-- 2. Mirdzošā laika spirāles mala ap atveri -->
    <a-ring 
      position="0 0 0.03" 
      radius-inner="0.73" 
      radius-outer="0.76" 
      material="color: #f59e0b; emissive: #d97706; emissiveIntensity: 1.8;"
      animation="property: rotation; to: 0 0 360; dur: 12000; easing: linear; loop: true">
    </a-ring>

    <!-- 3. Kambaris / tunelis 1.2 metru dziļumā sienā -->
    <a-cylinder 
      position="0 0 -0.6" 
      rotation="90 0 0" 
      radius="0.74" 
      height="1.2" 
      open-ended="true" 
      side="back" 
      material="color: #18181b; roughness: 0.95;">
    </a-cylinder>

    <!-- 4. Dzīvais vēsturiskās smēdes video tuneļa aizmugurē (-1.2m dziļi iekšā sienā) -->
    <a-video 
      src="#forgeVideo" 
      position="0 0 -1.2" 
      width="2.1" 
      height="1.18" 
      rotation="0 0 0">
    </a-video>

    <!-- 5. Kvēlojošās ogļu uguns gaisma telpas dziļumā -->
    <a-entity 
      light="type: point; intensity: 3.5; distance: 3.2; color: #f97316;" 
      position="0 -0.2 -0.8"
      animation="property: light.intensity; from: 2.8; to: 4.2; dir: alternate; dur: 450; loop: true">
    </a-entity>

    <!-- Kalēja dzirksteļu imitācijas lode -->
    <a-sphere 
      position="0 -0.4 -0.9" 
      radius="0.08" 
      material="color: #fbbf24; emissive: #ea580c; emissiveIntensity: 3.0;"
      animation="property: scale; from: 0.8 0.8 0.8; to: 1.25 1.25 1.25; dir: alternate; dur: 350; loop: true">
    </a-sphere>

    <!-- Hologrāfisks laikmeta nosaukums virs portāla -->
    <a-text 
      value="ADATU KALĒJI • 18. GADSIMTS" 
      position="0 1.08 0.05" 
      align="center" 
      scale="0.65 0.65 0.65" 
      color="#fbbf24" 
      font="aileronsemibold">
    </a-text>

  </a-entity>
</a-scene>

<script>
  const target = document.querySelector('#portalTarget');
  const statusText = document.querySelector('#status-text');
  const soundBtn = document.querySelector('#soundBtn');
  const video = document.querySelector('#forgeVideo');

  // Lietotāja pieskāriens audio/video atskaņošanas aktivizēšanai
  soundBtn.addEventListener('click', () => {
    video.play();
    video.pause();
    soundBtn.style.display = 'none';
    statusText.innerText = "Portāls gatavs! Pavērsiet kameru pret sienu";
  });

  // Kad kamera atrod mērķa attēlu pie sienas
  target.addEventListener('targetFound', () => {
    video.play();
    statusText.innerHTML = "Portāls atvērts! <b>Ieskaties dziļāk sienā</b>";
  });

  // Kad kamera pazaudē mērķi
  target.addEventListener('targetLost', () => {
    video.pause();
    statusText.innerText = "Pavērsiet kameru pret atzīmi pie sienas";
  });
</script>
