<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Adatu Fabrika AR</title>
    <!-- A-Frame AR ietvars -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* Sveiciena uzraksts apakšā */
      #ui-overlay {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 88%;
        max-width: 400px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #ffffff;
        padding: 16px 20px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 1px solid rgba(255, 215, 0, 0.3);
        text-align: center;
        z-index: 1000;
        pointer-events: none;
      }
      #ui-overlay h2 {
        margin: 0 0 4px 0;
        font-size: 18px;
        letter-spacing: 1px;
        color: #f6d365;
        text-transform: uppercase;
      }
      #ui-overlay p {
        margin: 0;
        font-size: 13px;
        color: #cbd5e1;
      }
    </style>

    <script>
      // Ģenerē procedurālu zelta/neona diega vijumu telpā
      AFRAME.registerComponent('golden-thread', {
        init: function () {
          const points = [];
          // Zīmē vijīgu 3D spirāli/taku ap adatu
          for (let i = 0; i < 120; i++) {
            const t = i * 0.12;
            const r = 0.3 + 0.08 * Math.sin(t * 3);
            const x = Math.sin(t) * r;
            const z = Math.cos(t) * r;
            const y = 1.3 - (i * 0.025); // vijas no adatas acs uz leju
            points.push(new THREE.Vector3(x, y, z));
          }

          const curve = new THREE.CatmullRomCurve3(points);
          const tubeGeometry = new THREE.TubeGeometry(curve, 100, 0.012, 8, false);
          
          // Mirdzošs zelta/oranžs materiāls
          const material = new THREE.MeshStandardMaterial({
            color: 0xffaa00,
            emissive: 0xff6600,
            emissiveIntensity: 0.8,
            roughness: 0.2,
            metalness: 0.9
          });

          const mesh = new THREE.Mesh(tubeGeometry, material);
          this.el.setObject3D('mesh', mesh);
        }
      });
    </script>
  </head>
  <body>
    <div id="ui-overlay">
      <h2>Adatu Fabrika</h2>
      <p>Pavērsiet kameru pret telpu un aplūkojiet no visām pusēm</p>
    </div>

    <a-scene 
      webxr="optionalFeatures: hit-test, local-floor;"
      renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
      vr-mode-ui="enabled: false">
      
      <!-- Telpas apgaismojums metāliskam spīdumam -->
      <a-entity light="type: ambient; intensity: 0.9; color: #ffffff;"></a-entity>
      <a-entity light="type: directional; intensity: 1.8; color: #fff8e7;" position="2 4 2"></a-entity>
      <a-entity light="type: point; intensity: 2; distance: 5; color: #ffaa00;" position="0 1.2 -2"></a-entity>

      <a-camera position="0 1.6 0" look-controls="enabled: true"></a-camera>

      <!-- ADATAS UN DIEGA KOMPOZĪCIJA (Novietota 2.5 metrus priekšā kameras skatam) -->
      <!-- animācija liek visam lēni levitēt un rotēt gaisā -->
      <a-entity 
        position="0 1.5 -2.5" 
        animation="property: position; to: 0 1.7 -2.5; dir: alternate; dur: 3200; easing: easeInOutSine; loop: true"
        animation__rot="property: rotation; to: 0 360 0; dur: 24000; easing: linear; loop: true">

        <!-- 1. Hromētā Adatas smailā daļa (Konuss) -->
        <a-cone 
          position="0 -0.4 0" 
          rotation="180 0 0" 
          radius-bottom="0.04" 
          radius-top="0.002" 
          height="1.2" 
          material="color: #e5e7eb; metalness: 0.98; roughness: 0.12;">
        </a-cone>

        <!-- 2. Adatas galvenais korpuss (Cilindrs) -->
        <a-cylinder 
          position="0 0.5 0" 
          radius="0.04" 
          height="0.8" 
          material="color: #e5e7eb; metalness: 0.98; roughness: 0.12;">
        </a-cylinder>

        <!-- 3. Adatas acs augšdaļa (Torus/gredzens ar atveri) -->
        <a-torus 
          position="0 1.05 0" 
          radius="0.04" 
          radius-tubular="0.015" 
          arc="360" 
          material="color: #e5e7eb; metalness: 0.98; roughness: 0.12;">
        </a-torus>

        <!-- 4. Mirdzošais zelta pavediens, kas izvijas cauri acij -->
        <a-entity golden-thread></a-entity>

        <!-- 5. Gaismas daļiņas / Mirdzums pie adatas smailes -->
        <a-sphere 
          position="0 -1.0 0" 
          radius="0.02" 
          material="color: #ffffff; emissive: #60a5fa; emissiveIntensity: 2.0;">
        </a-sphere>

        <!-- 6. Peldošs hologrāfisks uzraksts zem adatas -->
        <a-text 
          value="ADATU FABRIKA" 
          position="0 -1.25 0" 
          align="center" 
          scale="0.9 0.9 0.9"
          color="#f6d365" 
          font="aileronsemibold">
        </a-text>
      </a-entity>
    </a-scene>
  </body>
</html>
