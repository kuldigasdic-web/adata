<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Adatu Fabrikas Laika Plaisa (4x)</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #startOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999999;
      }
      #startBtn {
        padding: 18px 36px;
        background: linear-gradient(135deg, #b91c1c, #450a0a);
        color: white;
        border: 2px solid #ef4444;
        border-radius: 40px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 30px rgba(239, 68, 68, 0.7);
      }
      #statusBox {
        display: none;
        position: absolute;
        top: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 85%;
        max-width: 380px;
        background: rgba(10, 10, 10, 0.85);
        backdrop-filter: blur(10px);
        color: #fff;
        padding: 12px 18px;
        border-radius: 20px;
        border: 1px solid rgba(239, 68, 68, 0.5);
        text-align: center;
        z-index: 10000;
      }
      #statusBox h3 {
        margin: 0 0 2px 0;
        font-size: 15px;
        color: #ef4444;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      #statusBox p {
        margin: 0;
        font-size: 13px;
        color: #cbd5e1;
      }
    </style>

    <script>
      // Ģenerē milzīgu, neregulāru plaisu (4 reizes lielāka)
      AFRAME.registerComponent('rift-portal', {
        init: function () {
          const shape = new THREE.Shape();
          const pointsCount = 60;
          // Pamatrādiuss palielināts 4x: no 0.68 uz 2.72 metriem
          const radiusBase = 2.72;

          for (let i = 0; i <= pointsCount; i++) {
            const theta = (i / pointsCount) * Math.PI * 2;
            const noise = Math.sin(theta * 5) * 0.32 + Math.cos(theta * 3) * 0.20 + (Math.sin(theta * 9) * 0.12);
            const r = radiusBase + noise;
            const x = Math.cos(theta) * r;
            const y = Math.sin(theta) * r * 1.25;
            if (i === 0) shape.moveTo(x, y);
            else shape.lineTo(x, y);
          }

          const geometry = new THREE.ShapeGeometry(shape);
          
          const videoEl = document.querySelector('#smedeVideo');
          const videoTexture = new THREE.VideoTexture(videoEl);
          videoTexture.minFilter = THREE.LinearFilter;
          videoTexture.magFilter = THREE.LinearFilter;

          const portalMaterial = new THREE.MeshBasicMaterial({
            map: videoTexture,
            side: THREE.DoubleSide
          });

          const mesh = new THREE.Mesh(geometry, portalMaterial);
          mesh.position.z = 0.02;
          this.el.setObject3D('mesh', mesh);

          // Kvēlojošā ārējā līnija
          const edgePoints = shape.getPoints();
          const edgeGeometry = new THREE.BufferGeometry().setFromPoints(edgePoints);
          const edgeMaterial = new THREE.LineBasicMaterial({
            color: 0xff2200,
            linewidth: 4
          });
          const edgeLine = new THREE.LineLoop(edgeGeometry, edgeMaterial);
          edgeLine.position.z = 0.03;
          this.el.setObject3D('edge', edgeLine);
        }
      });
    </script>
  </head>
  <body>
    <div id="startOverlay">
      <button id="startBtn">Atvērt laika plaisu</button>
    </div>

    <div id="statusBox">
      <h3>LAIKA PLAISA</h3>
      <p id="status-text">Pavērsiet kameru pret atzīmi</p>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.01; missTolerance: 6;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <video 
          id="smedeVideo" 
          src="./smede.mp4" 
          preload="auto" 
          crossorigin="anonymous"
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="portalTarget" mindar-image-target="targetIndex: 0">
        
        <!-- PLAISAS KONTEINERS -->
        <a-entity id="portalContainer" scale="0 0 0" visible="false">
          
          <!-- Milzīgā organiskā plaisa ar video -->
          <a-entity rift-portal></a-entity>

          <!-- 4x lielāks ārējais enerģijas oreols (rādiuss 2.6m - 3.4m) -->
          <a-ring 
            position="0 0 0.01" 
            radius-inner="2.6" 
            radius-outer="3.4" 
            material="color: #7f1d1d; emissive: #dc2626; emissiveIntensity: 1.8; opacity: 0.65; transparent: true;"
            animation="property: scale; from: 0.96 0.96 1; to: 1.04 1.04 1; dir: alternate; dur: 900; loop: true">
          </a-ring>

          <!-- Spēcīga sarkana gaisma telpā -->
          <a-entity 
            light="type: point; intensity: 5.0; distance: 6; color: #ef4444;" 
            position="0 0 0.3"
            animation="property: light.intensity; from: 3.5; to: 6.0; dir: alternate; dur: 450; loop: true">
          </a-entity>

          <!-- Teksts novietots augstāk virs 4x lielās plaisas -->
          <a-text 
            value="18. GADSIMTS • ADATU SMĒDE" 
            position="0 3.7 0.05" 
            align="center" 
            scale="1.2 1.2 1.2" 
            color="#ef4444">
          </a-text>

        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const startOverlay = document.querySelector('#startOverlay');
      const startBtn = document.querySelector('#startBtn');
      const statusBox = document.querySelector('#statusBox');
      const statusText = document.querySelector('#status-text');
      const video = document.querySelector('#smedeVideo');
      const target = document.querySelector('#portalTarget');
      const portal = document.querySelector('#portalContainer');

      let openTimer = null;

      startBtn.addEventListener('click', () => {
        video.play().then(() => {
          video.pause();
          video.currentTime = 0;
        }).catch(() => {});

        startOverlay.style.display = 'none';
        statusBox.style.display = 'block';
      });

      target.addEventListener('targetFound', () => {
        statusText.innerHTML = "Plīsums telpā atrasts. Veras vaļā...";
        openTimer = setTimeout(() => {
          openRift();
        }, 1800);
      });

      target.addEventListener('targetLost', () => {
        if (openTimer) clearTimeout(openTimer);
        closeRiftQuick();
        statusText.innerText = "Pavērsiet kameru pret attēlu";
      });

      function openRift() {
        portal.setAttribute('visible', 'true');
        statusText.innerHTML = "Plaisa atvērta! <b>Ieskaties 18. gadsimtā</b>";

        portal.removeAttribute('animation');
        portal.setAttribute('animation', {
          property: 'scale',
          from: '0 0 0',
          to: '1 1 1',
          dur: 1800,
          easing: 'easeOutElastic'
        });

        video.currentTime = 0;
        video.play();
      }

      video.addEventListener('ended', () => {
        statusText.innerHTML = "Plaisa aizveras...";

        portal.removeAttribute('animation');
        portal.setAttribute('animation', {
          property: 'scale',
          from: '1 1 1',
          to: '0 0 0',
          dur: 1400,
          easing: 'easeInBack'
        });

        setTimeout(() => {
          portal.setAttribute('visible', 'false');
          statusText.innerText = "Plaisa noslēgusies. Pavērsiet kameru no jauna.";
        }, 1400);
      });

      function closeRiftQuick() {
        video.pause();
        portal.setAttribute('visible', 'false');
        portal.setAttribute('scale', '0 0 0');
      }
    </script>
  </body>
</html>
