<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Adatu Fabrika AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: transparent;
      }
      /* Reālā kameras fona plūsma iPhone un Android pārlūkiem */
      #camera-feed {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }
      a-scene {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
      }
      #ui-overlay {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 86%;
        max-width: 380px;
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #ffffff;
        padding: 14px 20px;
        border-radius: 22px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        border: 1px solid rgba(255, 215, 0, 0.3);
        text-align: center;
        z-index: 1000;
        pointer-events: none;
      }
      #ui-overlay h2 {
        margin: 0 0 4px 0;
        font-size: 17px;
        letter-spacing: 1.5px;
        color: #f6d365;
        text-transform: uppercase;
      }
      #ui-overlay p {
        margin: 0;
        font-size: 13px;
        color: #e2e8f0;
      }
    </style>

    <script>
      // 1. Piekļuve telefona aizmugurējai kamerai
      window.addEventListener('DOMContentLoaded', () => {
        const video = document.getElementById('camera-feed');
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        }).then(stream => {
          video.srcObject = stream;
        }).catch(err => {
          console.error("Kameras kļūda:", err);
        });
      });

      // 2. Anatomiski precīza šujamadata (ar īstu iegarenu adatas aci)
      AFRAME.registerComponent('realistic-needle', {
        init: function () {
          const group = new THREE.Group();
          const chromeMaterial = new THREE.MeshStandardMaterial({
            color: 0xdddddd,
            metalness: 0.98,
            roughness: 0.15
          });

          // Adatas smailais gals (lejasdaļa)
          const tipGeo = new THREE.CylinderGeometry(0.025, 0.001, 1.2, 32);
          const tipMesh = new THREE.Mesh(tipGeo, chromeMaterial);
          tipMesh.position.y = -0.6;
          group.add(tipMesh);

          // Vidusdaļa
          const bodyGeo = new THREE.CylinderGeometry(0.025, 0.025, 1.0, 32);
          const bodyMesh = new THREE.Mesh(bodyGeo, chromeMaterial);
          bodyMesh.position.y = 0.5;
          group.add(bodyMesh);

          // Adatas galva ar iegarenu aci (divi paralēli stienīši un noapaļota augša)
          const eyeLeftGeo = new THREE.CylinderGeometry(0.009, 0.009, 0.35, 16);
          const eyeLeft = new THREE.Mesh(eyeGeo = eyeLeftGeo, chromeMaterial);
          eyeLeft.position.set(-0.018, 1.15, 0);
          group.add(eyeLeft);

          const eyeRight = new THREE.Mesh(eyeLeftGeo, chromeMaterial);
          eyeRight.position.set(0.018, 1.15, 0);
          group.add(eyeRight);

          // Noapaļotā augšējā arka
          const topArchGeo = new THREE.TorusGeometry(0.018, 0.009, 16, 16, Math.PI);
          const topArch = new THREE.Mesh(topArchGeo, chromeMaterial);
          topArch.position.set(0, 1.32, 0);
          group.add(topArch);

          this.el.setObject3D('mesh', group);
        }
      });

      // 3. Vijīgs zelta neona diegs, kas precīzi iziet cauri adatas acij
      AFRAME.registerComponent('golden-thread', {
        init: function () {
          const points = [];
          // Sākums diegam - nāk no aizmugures tieši cauri adatas acij (y = 1.15, z = 0)
          points.push(new THREE.Vector3(0, 1.4, -0.4));
          points.push(new THREE.Vector3(0, 1.15, 0)); // Precīzi acī
          points.push(new THREE.Vector3(0.05, 0.95, 0.25));

          // Vijas uz leju ap adatas korpusu
          for (let i = 1; i <= 60; i++) {
            const t = i * 0.18;
            const r = 0.18 + 0.06 * Math.sin(t * 2);
            const x = Math.sin(t) * r;
            const z = Math.cos(t) * r;
            const y = 0.95 - (i * 0.038);
            points.push(new THREE.Vector3(x, y, z));
          }

          const curve = new THREE.CatmullRomCurve3(points);
          const tubeGeometry = new THREE.TubeGeometry(curve, 80, 0.008, 8, false);
          
          const threadMaterial = new THREE.MeshStandardMaterial({
            color: 0xffb703,
            emissive: 0xfb8500,
            emissiveIntensity: 0.9,
            roughness: 0.3,
            metalness: 0.7
          });

          const threadMesh = new THREE.Mesh(tubeGeometry, threadMaterial);
          this.el.setObject3D('mesh', threadMesh);
        }
      });
    </script>
  </head>
  <body>
    <!-- Kameras video fons -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <div id="ui-overlay">
      <h2>Adatu Fabrika</h2>
      <p>Ieskaties telpā caur kameras aci</p>
    </div>

    <!-- AR Aina ar caurspīdīgu fonu -->
    <a-scene embedded renderer="alpha: true; antialias: true;">
      
      <!-- Spēcīgas gaismas spīdumam un kontrastam telpā -->
      <a-entity light="type: ambient; intensity: 1.2;"></a-entity>
      <a-entity light="type: directional; intensity: 2.2;" position="2 4 3"></a-entity>
      <a-entity light="type: point; intensity: 2.5; distance: 4; color: #ffb703;" position="0 1.2 -1.8"></a-entity>

      <a-camera position="0 1.5 0" look-controls="enabled: true"></a-camera>

      <!-- ADATA UN DIEGS (Levitē 2 metrus priekšā kamerai) -->
      <a-entity 
        position="0 1.2 -2.0" 
        animation="property: position; to: 0 1.35 -2.0; dir: alternate; dur: 3000; easing: easeInOutSine; loop: true"
        animation__rot="property: rotation; to: 0 360 0; dur: 18000; easing: linear; loop: true">

        <!-- Īstā tērauda adata -->
        <a-entity realistic-needle></a-entity>

        <!-- Zelta diegs, kas iet caur aci -->
        <a-entity golden-thread></a-entity>

        <!-- Spīdums smailes galā -->
        <a-sphere 
          position="0 -1.2 0" 
          radius="0.015" 
          material="color: #ffffff; emissive: #38bdf8; emissiveIntensity: 2.5;">
        </a-sphere>

        <!-- Skaidri lasāms 3D uzraksts -->
        <a-text 
          value="ADATU FABRIKA" 
          position="0 -1.45 0" 
          align="center" 
          scale="0.8 0.8 0.8"
          color="#ffb703">
        </a-text>
      </a-entity>
    </a-scene>
  </body>
</html>
